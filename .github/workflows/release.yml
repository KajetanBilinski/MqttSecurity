name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate release tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            throw 'Use a version tag such as v0.1.0-preview.1 or v1.0.0.'
          }
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to master.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore
        run: dotnet restore MqttSecurity.slnx
      - name: Build
        run: dotnet build MqttSecurity.slnx -c Release --no-restore -p:Version="$RELEASE_VERSION"
      - name: Test
        run: dotnet test tests/MqttSecurity.Tests/MqttSecurity.Tests.csproj -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Pack
        run: dotnet pack MqttSecurity.slnx -c Release --no-build --no-restore -p:Version="$RELEASE_VERSION" --output artifacts/packages
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results
          path: artifacts/test-results
          if-no-files-found: warn
      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

